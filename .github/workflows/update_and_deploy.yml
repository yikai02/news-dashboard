name: 每日新聞抓取與 GitHub Pages 自動部署

on:
  schedule:
    # GitHub Actions 排程採用 UTC 時間：
    # UTC 23:30 -> 台灣時間 (UTC+8) 07:30 晨報版
    - cron: '30 23 * * *'
    # UTC 10:30 -> 台灣時間 (UTC+8) 18:30 晚報版
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: '出刊版本選擇 (auto: 依台灣時間自動判別 / morning: 晨報版 / evening: 晚報版)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
  push:
    branches:
      - main
    paths-ignore:
      - 'public/daily_news.json'
      - 'public/index.html'
      - '.hallmark/**'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-build:
    name: 抓取新聞並構建靜態網站
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行新聞抓取、重要性評分與 HTML 同步渲染
        env:
          TZ: 'Asia/Taipei'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EDITION="${{ github.event.inputs.edition || 'auto' }}"
          python scripts/fetch_news.py --edition "$EDITION"

      - name: 將最新資料與靜態頁面 Commit 並 Push 回儲存庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/daily_news.json public/index.html
          if git diff --staged --quiet; then
            echo "無新增變更，跳過 Commit"
          else
            git commit -m "chore(data): auto update daily news and index [skip ci]"
            git push origin main
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 構件 (public/ 資料夾)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    name: 部署至 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: 部署網站
        id: deployment
        uses: actions/deploy-pages@v4
