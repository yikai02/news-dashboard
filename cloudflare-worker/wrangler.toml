name = "news-dashboard-cron"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[vars]
GITHUB_OWNER = "yikai02"
GITHUB_REPO = "news-dashboard"
WORKFLOW_FILE = "update_and_deploy.yml"

[triggers]
# 台灣時間 (UTC+8) 每日 5 次準點推播更新：
# 07:30 晨報版 = UTC 23:30
# 09:15 財經皓角直播後速更新 = UTC 01:15
# 12:30 午間產業更新 = UTC 04:30
# 16:00 台股盤後晚報版 = UTC 08:00
# 21:30 美股開盤前重點 = UTC 13:30
crons = ["30 23 * * *", "15 1 * * *", "30 4 * * *", "0 8 * * *", "30 13 * * *"]
